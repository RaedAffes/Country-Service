---
- name: Build, push and deploy country-service
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vault.yml

  vars:
    image_repo: raedaffes/country-service-my-country-service2
    image_tag: latest

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        reauthorize: true
      no_log: true

    - name: Build Docker image
      community.docker.docker_image:
        name: "{{ image_repo }}"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ playbook_dir }}"
          nocache: true
        state: present
        force_source: true

    - name: Push Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ image_repo }}"
        tag: "{{ image_tag }}"
        push: true
        source: local

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', playbook_dir + '/deployment.yaml') | from_yaml }}"
        wait: true
        wait_timeout: 180

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        src: "{{ playbook_dir }}/service.yaml"
